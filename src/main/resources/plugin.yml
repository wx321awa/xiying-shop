name: XiYingShop
version: 1.0.0
main: com.xiying.shop.XiYingShopPlugin
api-version: '1.21'
authors: ["xxhh."]
description: 曦荧玩家商店（Java 箱子界面 + 基岩 Floodgate 表单）
depend: [Vault]
softdepend: [PlayerPoints, floodgate, Geyser-Spigot]
commands:
  pshop:
    description: 打开曦荧玩家商店
    aliases: [ps, xyshop, eshop, market, mall, store]
    usage: /pshop
permissions:
  xiyingshop.use:
    default: true
  xiyingshop.admin:
    default: op
